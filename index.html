<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作文批改系统</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>
                ✍️ 作文批改系统
                <span class="badge">AI 辅助</span>
            </h1>
            <div class="header-actions">
                <span style="font-size:13px;color:#718096;">📸 最多 10 张</span>
            </div>
        </div>

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="ai">
                🤖 智能批改
                <span class="badge">自动评分+评语</span>
            </button>
            <button class="mode-tab" data-mode="manual">
                ✏️ 手动批改
                <span class="badge">勾选+手动打分</span>
            </button>
        </div>

        <!-- 智能批改模式 -->
        <div class="mode-content active" id="aiMode">
            <!-- 上传区域 -->
            <div class="upload-area" id="dropZone">
                <div class="icon">📤</div>
                <div class="text">点击上传或拖拽手写图片</div>
                <div class="hint">支持 JPG / PNG / BMP，最多 10 张</div>
                <input type="file" id="fileInput" accept="image/*" multiple />
            </div>

            <!-- 预览 -->
            <div class="preview-grid" id="previewGrid"></div>

            <!-- 按钮 -->
            <div class="btn-group">
                <button class="btn btn-primary" id="recognizeBtn" disabled>🔍 开始识别</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ 清空全部</button>
                <button class="btn btn-success" id="copyBtn" style="display:none;">📋 复制结果</button>
            </div>

            <!-- 进度条 -->
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>

            <!-- 状态 -->
            <div class="status-bar">
                <span id="statusText">就绪</span>
                <div class="spinner" id="loadingSpinner"></div>
            </div>

            <!-- 智能批改结果 -->
            <div class="result-area" id="resultArea">
                <div class="label">
                    <span>📊 批改结果</span>
                    <span class="char-count" id="resultCount"></span>
                </div>
                <div class="result-box" id="resultBox">
                    <span class="placeholder">等待识别...</span>
                </div>
                <div id="aiResult"></div>
            </div>
        </div>

        <!-- 手动批改模式 -->
        <div class="mode-content" id="manualMode">
            <div style="margin-bottom:16px;padding:16px;background:#ebf8ff;border-radius:12px;border-left:4px solid #4299e1;">
                <div style="font-weight:600;color:#2b6cb0;">📝 手动批改模式</div>
                <div style="font-size:14px;color:#4a5568;margin-top:4px;">
                    先在上方上传并识别作文，然后在下方进行手动打分和评语勾选。
                </div>
            </div>

            <!-- 手动批改区域（由JS动态渲染） -->
            <div id="manualGradingArea"></div>

            <!-- 手动批改结果 -->
            <div id="manualResultArea" style="display:none;margin-top:20px;">
                <div class="label">
                    <span>📊 批改结果</span>
                </div>
                <div id="manualResult"></div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <span>⚡ 准确率 ≥ 95% · 百度OCR</span>
            <span>🤖 智能批改 · ✏️ 手动批改</span>
        </div>
    </div>

    <!-- 加载 JavaScript 模块 -->
    <script src="/js/ocr.js"></script>
    <script src="/js/ai-grading.js"></script>
    <script src="/js/manual-grading.js"></script>
    <script src="/js/main.js"></script>

</body>
</html>
